name: Integración continua

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Compilación y pruebas
    runs-on: ubuntu-latest

    steps:
      - name: Obtener código fuente
        uses: actions/checkout@v7

      - name: Configurar Java 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v4

      - name: Instalar Android SDK 37
        run: |
          sdkmanager "platforms;android-37.0" "build-tools;36.0.0" --channel=3

      - name: Preparar Gradle Wrapper
        run: chmod +x gradlew

      - name: Compilar y ejecutar verificaciones
        run: |
          ./gradlew --no-daemon --stacktrace clean assembleDebug testDebugUnitTest lintDebug
